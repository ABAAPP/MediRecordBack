name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build y tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Mostrar informacion de la JVM
        run: java -version

      # Testcontainers necesita el daemon de Docker (disponible en los runners de GitHub).
      # ./mvnw verify -Pintegration corre: unitarios + integracion + reporte JaCoCo.
      - name: Build con tests (incluye integracion)
        run: ./mvnw -B -ntp verify -Pintegration

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Subir imagen de la aplicacion
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: medirecord:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max