# Configuracion base (comun a todos los perfiles). Lo especifico de cada perfil vive en
# application-<perfil>.properties. Todo es sobreescribible por variables de entorno.
# ======================================================================================
spring.application.name=medirecord
spring.profiles.default=dev

# --- Java 21: virtual threads para el servidor ---
spring.threads.virtual.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Base de datos ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:medirecord}
spring.datasource.username=${DB_USER:medirecord}
spring.datasource.password=${DB_PASSWORD:napolitano}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=medirecord-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-init-sql=SET TIME ZONE 'UTC'

# --- JPA/Hibernate: el esquema es de Flyway, Hibernate solo valida ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# --- Jackson 3 (Boot 4 usa tools.jackson) ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Seguridad: JWT de Keycloak (resource server) ---
# Keycloak corre en el puerto 8081 del host (ver docker-compose.yml); dentro de la
# red de Docker se usa http://keycloak:8080.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/medirecord}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/medirecord}/protocol/openid-connect/certs}

# --- Servidor HTTP ---
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.servlet.application-display-name=${spring.application.name}

# --- Observabilidad ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
# NOTA: no activar management.info.env.enabled (expondría variables de entorno, incluidas
# contraseñas, por /actuator/info). En produccion los secretos van en un gestor de secretos.

# --- Documentacion OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# --- Configuracion propia ---
medirecord.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}

# --- Logging ---
logging.level.root=INFO
logging.level.com.api.medirecord=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
