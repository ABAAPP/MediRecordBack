# ======================================================================================
# Perfil de produccion: todo por variables de entorno, sin verbosidad, fail-fast.
# ======================================================================================
spring.jpa.show-sql=false

# En produccion solo se aplican migraciones pendientes; nunca se resetea el esquema
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

spring.devtools.restart.enabled=false

management.endpoint.health.show-details=never

# Documentacion desactivada por defecto en produccion
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

logging.level.root=WARN
logging.level.com.api.medirecord=${LOG_LEVEL_APP:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n