# ======================================================================================
# Configuracion exclusiva de tests (perfil "test").
# La conexion la inyecta Testcontainers via @ServiceConnection
# (ver support/PostgresTestContainer.java).
# ======================================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# Issuer ficticio: los tests nunca validan el token contra Keycloak (se usa @WithMockUser
# o un JwtDecoder mockeado).
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://keycloak.test/realms/medirecord
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://keycloak.test/realms/medirecord/protocol/openid-connect/certs

server.port=0

logging.level.root=WARN
logging.level.com.api.medirecord=INFO
logging.level.org.springframework.test=WARN
logging.level.org.testcontainers=INFO
logging.level.tc=WARN