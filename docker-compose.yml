# ======================================================================================
# Stack de infraestructura para desarrollo.
#
#   docker compose up -d                      -> solo PostgreSQL + Keycloak (API desde el IDE)
#   docker compose --profile app up -d --build -> todo, incluida la API compilada en imagen
#
# El servicio "app" esta en un perfil para no arrancar la imagen compilada en cada
# `docker compose up`: en desarrollo la API se ejecuta desde el IDE (hot reload).
# ======================================================================================
name: medirecord

services:
  postgres:
    image: postgres:17-alpine
    container_name: medirecord-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-medirecord}
      POSTGRES_USER: ${DB_USER:-medirecord}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-napolitano}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-medirecord} -d ${DB_NAME:-medirecord}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ medirecord-net ]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: medirecord-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --http-enabled=true
      - --http-port=8080
    environment:
      # Administrador inicial de Keycloak (crea el realm si no existe)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      TZ: UTC
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      # Realm de desarrollo: usuarios y roles listos para usar
      - ./docker/keycloak/medirecord-realm.json:/opt/keycloak/data/import/medirecord-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          timeout 5 cat <&3 | grep -q '"status": "UP"'
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    networks: [ medirecord-net ]

  app:
    profiles: [ "app" ]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medirecord-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-medirecord}
      DB_USER: ${DB_USER:-medirecord}
      DB_PASSWORD: ${DB_PASSWORD:-medirecord}
      # Dentro de la red de Docker, Keycloak escucha en 8080
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/medirecord
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/medirecord/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SWAGGER_ENABLED: "true"
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks: [ medirecord-net ]

volumes:
  postgres-data:
  keycloak-data:

networks:
  medirecord-net:
    driver: bridge
